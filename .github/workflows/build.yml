name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $expected = $tag -replace '^v',''
          $confJson = Get-Content -Raw -Path src-tauri/tauri.conf.json | ConvertFrom-Json
          if ($confJson.version -ne $expected) {
            Write-Error "tauri.conf.json version ($($confJson.version)) does not match tag ($expected)"
            exit 1
          }
          $cargoToml = Get-Content -Raw -Path src-tauri/Cargo.toml
          if ($cargoToml -notmatch "version = `"$([regex]::Escape($expected))`"") {
            Write-Error "src-tauri/Cargo.toml version does not match tag ($expected)"
            exit 1
          }
          $configPy = Get-Content -Raw -Path backend/config.py
          if ($configPy -notmatch "APP_VERSION = `"$([regex]::Escape($expected))`"") {
            Write-Error "backend/config.py APP_VERSION does not match tag ($expected)"
            exit 1
          }
          Write-Host "Version OK across the board: $expected"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python sidecar (tune-backend.exe)
        run: |
          pyinstaller --onefile --noconsole --name tune-backend `
            --collect-all winsdk --collect-all PIL `
            --distpath dist-backend `
            -p . `
            backend/__main__.py

      - name: Place sidecar binary for Tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item dist-backend/tune-backend.exe src-tauri/binaries/tune-backend-x86_64-pc-windows-msvc.exe -Force
          Get-ChildItem src-tauri/binaries

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri app (NSIS installer)
        run: npm run build -- --target x86_64-pc-windows-msvc
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Locate installer
        id: locate
        shell: pwsh
        run: |
          $candidates = Get-ChildItem -Recurse -Path src-tauri/target -Filter "*-setup.exe" -ErrorAction SilentlyContinue
          if (-not $candidates) {
            Write-Error "No NSIS installer was produced."
            exit 1
          }
          $installer = $candidates[0]
          Write-Host "Installer: $($installer.FullName)"
          "installer=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLower()
          "$hash  $($installer.Name)" | Out-File -FilePath "$($installer.FullName).sha256" -Encoding ascii -NoNewline

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: Tune-windows-x64
          path: |
            ${{ steps.locate.outputs.installer }}
            ${{ steps.locate.outputs.installer }}.sha256

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.locate.outputs.installer }}
            ${{ steps.locate.outputs.installer }}.sha256
          generate_release_notes: true
